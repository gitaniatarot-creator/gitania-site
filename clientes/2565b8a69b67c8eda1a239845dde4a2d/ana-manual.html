<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Espacio privado · Gitania</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/gt-buy.css?v=2">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&display=swap');
  :root{--paper:#FBFAF6;--raised:#FFFFFF;--ink:#17130F;--soft:#55503F;--line:#E3DFD3;--clay:#B30E20;--sky:#03989E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Karla",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:380px;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:0 24px 50px -28px rgba(25,20,10,.5)}
  .logo{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;display:block}
  .label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--clay)}
  h1{font-size:1.45rem;font-weight:700;margin:8px 0}
  p{color:var(--soft);font-size:.92rem;margin:0 0 16px}
  .inp{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);margin-bottom:10px;outline:none}
  .inp:focus{border-color:var(--sky)}
  .err{margin-top:10px;font-size:.84rem;color:var(--clay);min-height:1.1em}
  .care{margin-top:16px;font-size:.78rem}
  #cargando{display:none;color:var(--soft);font-size:.95rem}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <img class="logo" src="logo.png" alt="Gitania" draggable="false">
    <span class="label">Acceso privado</span>
    <h1>Tu espacio VIP</h1>
    <div id="formBox">
      <p>Escribe el usuario y la contraseña que te compartí.</p>
      <form id="f" novalidate>
        <input class="inp" id="gUser" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
        <input class="inp" id="gPass" type="password" placeholder="Contraseña" autocomplete="current-password">
        <button class="gt-buy block" id="gBtn" type="submit">Entrar</button>
      </form>
      <div class="err" id="gErr" role="alert"></div>
    </div>
    <p id="cargando">Abriendo tu espacio…</p>
    <p class="care">Espacio de acompañamiento y reflexión. No sustituye la atención psicológica ni médica. Línea de la Vida: 800 911 2000 (24 h).</p>
  </div>
</div>
<script>
(function(){
  "use strict";
  // El contenido, los audios y los videos viven en el servidor (gitania-pagos) y solo se entregan con una sesión válida.
  var API = "https://gitania-pagos.netlify.app/api/vip/";
  var TK = "gitania_vip_t", ITER = 200000;
  var err = document.getElementById("gErr");
  function hex(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2, "0"); }).join(""); }
  async function derive(u, p){
    var e = new TextEncoder(), k = await crypto.subtle.importKey("raw", e.encode(p), "PBKDF2", false, ["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: e.encode("gitania-vip:" + u), iterations: ITER }, k, 256));
  }
  function cargando(on){ document.getElementById("formBox").style.display = on ? "none" : ""; document.getElementById("cargando").style.display = on ? "block" : "none"; }
  function abrir(t){
    cargando(true);
    return fetch(API + "pagina?t=" + encodeURIComponent(t), { cache: "no-store" }).then(function(r){
      if (r.status === 401){ try{ sessionStorage.removeItem(TK); }catch(e){} throw new Error("Tu sesión terminó. Vuelve a entrar."); }
      if (!r.ok) throw new Error("No se pudo abrir tu espacio. Intenta de nuevo en un momento.");
      return r.text();
    }).then(function(html){
      try{ sessionStorage.setItem("gitania_vip_ok", "srv"); }catch(e){}
      document.open(); document.write(html); document.close();
    }).catch(function(e){ cargando(false); err.textContent = e.message; });
  }
  function login(u, k){
    return fetch(API + "login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: u, k: k }) })
      .then(function(r){ return r.json().then(function(x){ if (!r.ok) throw new Error(x.error || "Usuario o contraseña incorrectos."); return x; }); })
      .then(function(x){ try{ sessionStorage.setItem(TK, x.token); }catch(e){} return abrir(x.token); });
  }
  document.getElementById("f").addEventListener("submit", async function(e){
    e.preventDefault();
    var u = (document.getElementById("gUser").value || "").trim().toLowerCase(), p = (document.getElementById("gPass").value || "").trim();
    if (!u || !p){ err.textContent = "Escribe tu usuario y tu contraseña."; return; }
    err.textContent = "Revisando…";
    try{ await login(u, await derive(u, p)); }catch(x){ cargando(false); err.textContent = x.message; }
  });
  var t = ""; try{ t = sessionStorage.getItem(TK) || ""; }catch(e){}
  if (t) abrir(t);
})();
</script>
</body>
</html>
